[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisage"
version = "0.1.0"
description = "Retrieve a tennis player's career matches from tennisabstract.com and plot the age gap vs. opponents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "matplotlib>=3.6", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
